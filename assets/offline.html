<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保存した会場案内 | Spatial</title><style nonce="__NONCE__">body{font:17px/1.7 system-ui;color:#193442;background:#f2f6f8;max-width:760px;margin:auto;padding:24px}article{background:white;border:1px solid #b7c8d1;border-radius:16px;padding:24px;margin:20px 0}button,a{color:#086c78;font:inherit;min-height:44px}p{white-space:pre-wrap}small{color:#475d68}</style><h1>保存した会場案内</h1><p>保存時点の情報です。変更や中止を出発前にオンラインで確認してください。</p><main></main><button id="clear">この端末の保存をすべて消去</button><p><a href="/">Spatialに戻る</a></p><script nonce="__NONCE__">(()=>{let expiryTimer;const stopAt=1798729200000;function expiry(){if(Date.now()<stopAt)return false;clearInterval(expiryTimer);document.body.innerHTML='<h1>提供期間が終了しました</h1>';return true;}if(expiry())return;expiryTimer=setInterval(expiry,1000);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key='spatial-offline:'+localStorage.getItem('spatial-offline-active');let entries=[];try{entries=JSON.parse(localStorage.getItem(key)||'[]')}catch{}document.querySelector('main').innerHTML=entries.map(e=>'<article><h2>'+esc(e.name)+'</h2><p>'+esc(e.date)+'<br>'+esc(e.place)+'<br>'+esc(e.address)+'</p><p>入口：'+esc(e.entrance)+'</p><p>連絡方法：'+esc(e.contact)+'<br>当日連絡：'+esc(e.emergency)+'</p><small>保存日時 '+esc(e.saved)+'</small><p><a href="/?view=event&id='+encodeURIComponent(e.id)+'">最新情報を確認</a></p></article>').join('')||'<p>保存した案内はありません。</p>';document.querySelector('#clear').onclick=()=>{Object.keys(localStorage).filter(k=>k.startsWith('spatial-offline')).forEach(k=>localStorage.removeItem(k));location.reload();};})();</script></html>
