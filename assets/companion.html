<div id="poyo-root" data-token="{{TOKEN}}">
  <aside id="poyo-bubble" class="poyo-bubble" role="status" hidden><button type="button" id="poyo-bubble-close" aria-label="コメントを閉じる">×</button><p id="poyo-bubble-text"></p><button type="button" id="poyo-bubble-plan">操作の提案を見る →</button></aside>
  <button id="poyo-toggle" class="poyo-toggle" aria-label="ぽよアシストを開く" aria-expanded="false" aria-controls="poyo-panel"><span class="poyo-shadow"></span><span class="poyo-float"><span class="poyo-body"><span class="poyo-ear left"></span><span class="poyo-ear right"></span><span class="poyo-face"><i></i><i></i><b></b></span><span class="poyo-cheek left"></span><span class="poyo-cheek right"></span></span></span><span class="poyo-name">ぽよと話す</span></button>
  <section id="poyo-panel" class="poyo-panel" aria-label="ぽよアシスト" hidden>
    <div class="poyo-header"><div><b>ぽよ / Spatial Assist</b><small>あなたの今から、次の発見へ。</small></div><button id="poyo-close" aria-label="アシストを閉じる">×</button></div>
    <div id="poyo-messages" class="poyo-messages" role="log" aria-live="polite"></div>
    <div id="poyo-candidates" class="poyo-candidates"></div>
    <div class="poyo-presence"><button type="button" id="poyo-speaker" aria-pressed="false">発話：オフ</button><button type="button" id="poyo-roam" aria-pressed="true">おさんぽ：オン</button></div>
    <div id="poyo-screen-actions" class="poyo-screen-actions" aria-label="ぽよによる画面操作の提案"><small>操作はあなたの確認後に行います。</small><button type="button" data-poyo-action="open_map">地図を開く提案</button><button type="button" data-poyo-action="open_saved">保存一覧を開く提案</button></div>
    <details class="poyo-settings"><summary>いまの気分と提案の設定</summary><label>いまの過ごし方<select id="poyo-activity"><option value="exploring">街を探している</option><option value="relaxed">のんびりしたい</option><option value="short_break">短い休憩中</option></select></label><fieldset><legend>気になること</legend><label><input type="checkbox" name="poyo-interest" value="ART">アート</label><label><input type="checkbox" name="poyo-interest" value="MUSIC">音楽</label><label><input type="checkbox" name="poyo-interest" value="WALK">街歩き</label><label><input type="checkbox" name="poyo-interest" value="AR">AR</label></fieldset><label><input type="checkbox" id="poyo-proactive">状況が変わったら提案する</label><label><input type="checkbox" id="poyo-model">生成AIを使う</label><p>生成AIには入力・選択した興味・時刻・保存した体験・閲覧画面をGoogle Cloudへ送ります。global処理のため日本国内限定ではありません。1日100回まで。</p><label><input type="checkbox" id="poyo-location-share">取得済みの概略位置もAIに共有（約1km単位）</label><label><input type="checkbox" id="poyo-motion">動きを控えめにする</label><label><input type="checkbox" id="poyo-voice-consent">ブラウザの音声認識を使う（音声がブラウザ提供元のサービスに送られる場合があります）</label><button type="button" class="outline" id="poyo-clear">この端末の設定と会話を消去</button></details>
    <form id="poyo-form"><label class="sr-only" for="poyo-input">ぽよへのメッセージ</label><textarea id="poyo-input" maxlength="1200" rows="2" placeholder="今日、どんな体験がしたい？"></textarea><div class="poyo-input-actions"><button type="button" id="poyo-mic" class="outline">マイク</button><span id="poyo-source">状況ガイド</span><button class="primary" id="poyo-send">送信 →</button></div></form>
    <p id="poyo-status" class="poyo-status" role="status">位置情報・マイクは操作した時だけ使用します。</p>
  </section>
</div>
<dialog id="poyo-confirm" class="poyo-confirm" aria-labelledby="poyo-confirm-title"><span class="tag">YOU DECIDE</span><h2 id="poyo-confirm-title">この操作を行いますか？</h2><p id="poyo-confirm-description"></p><p class="muted">ぽよが操作を提案しています。あなたが確認するまで実行しません。有効期限は5分です。</p><p id="poyo-confirm-status" role="status"></p><div><button type="button" id="poyo-confirm-cancel" class="outline">今回はやめる</button><button type="button" id="poyo-confirm-run" class="primary">確認して実行</button></div></dialog>
